services:
  # FLEETPULSE 360 Backend Web Service (Render Free Tier)
  - type: web
    name: fleetpulse-api
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate --schema=prisma/schema.postgresql.prisma && npx prisma db push --schema=prisma/schema.postgresql.prisma && npm run build
    startCommand: node dist/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Provide persistent PostgreSQL URL (e.g., Neon or Supabase)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false # Set to your deployed frontend domain (e.g. https://fleetpulse-360.vercel.app)

  # FLEETPULSE 360 Frontend Static Site (Render Free Tier)
  - type: web
    name: fleetpulse-ui
    env: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Provide deployed backend URL e.g. https://fleetpulse-api.onrender.com/api
